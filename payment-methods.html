<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark-mode');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Methods - Financial Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="dark-mode.css">
    <style>
        .payment-methods-container { max-width: 1100px; margin: 20px auto; padding: 0 20px; }

        /* Scoped to this page's modal only - keep other modals (dashboard, trash, etc.) unchanged */
        #methodTransactionsModal .modal-content { max-width: 620px; }
        #methodTransactionsModal .modal-header { padding: 14px 20px; }
        #methodTransactionsModal .modal-header h2 { font-size: 1.15em; }
        #methodTransactionsModal .modal-body { padding: 16px 20px; }
        #methodTransactionsModal .btn-download { padding: 6px 12px; font-size: 0.85em; }
        #methodTransactionsModal .detail-table { font-size: 0.85em; }
        #methodTransactionsModal .detail-table th,
        #methodTransactionsModal .detail-table td { padding: 6px 8px; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <h1>💳 Payment Methods</h1>
            <div class="header-actions">
                <a href="dashboard.html" class="btn btn-secondary">← Dashboard</a>
                <a href="settings.html" class="btn btn-secondary">⚙️ Manage Methods</a>
            </div>
        </header>

        <div class="payment-methods-container">
            <div class="stats-grid" id="paymentMethodsGrid">
                <p class="loading-message">Loading...</p>
            </div>
        </div>

        <div id="methodTransactionsModal" class="modal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="methodTransactionsTitle">Transactions</h2>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <button class="btn btn-download" onclick="downloadMethodExcel()">📊 Excel</button>
                        <button class="btn btn-download" onclick="downloadMethodPDF()">📄 PDF</button>
                        <button class="modal-close" onclick="closeMethodTransactionsModal()">&times;</button>
                    </div>
                </div>
                <div class="modal-body" id="methodTransactionsBody"></div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="auth.js"></script>
    <script src="payment-methods.js"></script>
</body>
</html>
